<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body {
  margin: 0;
  font-family: monospace;
}</style></head><body><div id="debug">debug</div>
<canvas></canvas></body><script>//VARIABLES
//debug
let debug = document.getElementById('debug');

//canvas
let canvas = document.querySelector('canvas');
let ctx = canvas.getContext('2d');
let screenX = window.innerWidth;
let screenY = window.innerHeight;

//game
let maplevels = [['town',screenX/2,screenY - screenY/5],['lake',screenX/4,screenY/2,30,30],['forest',screenX - screenX/4,screenY/2],['mountain',screenX/2,screenY/5]];
let uibuttons = [['back',screenX/13,screenY-screenY/5],['next',screenX-screenX/12,screenY-screenY/5]];
let currentlevel = 'town';
let currentscreen = 'map';
let scenes = ['empty','combat'];

//FUNCTIONS
function init() {canvas.width = screenX; canvas.height = screenY}

function rand(min,max) {
  let mi = Math.ceil(min);
  return Math.floor(Math.random() * (Math.floor(max) - mi + 1) + mi);
}

function drawLevel(level) {
  if ((currentlevel == 'town' && level != 'mountain')||(currentlevel == 'lake' && level != 'forest')||(currentlevel == 'forest' && level != 'lake')||(currentlevel == 'mountain' && level != 'town')) {
    currentlevel = level;
    currentscreen = 'level';
    
    ctx.clearRect(0,0,screenX,screenY);
    //draw level background
    
    
    //back to map button
    ctx.fillStyle = 'red';
    ctx.fillRect(uibuttons[0][1],uibuttons[0][2],30,30);
    
    //next level scene button
    ctx.fillStyle = 'green';
    ctx.fillRect(uibuttons[1][1],uibuttons[1][2],30,30);
    
    debug.innerHTML = currentlevel;
  }
  else debug.innerHTML = 'cannot load level';
}

function drawMap() {
  ctx.clearRect(0,0,screenX,screenY);
  maplevels.forEach(e => {
    ctx.fillStyle = 'black';
    ctx.fillRect(e[1],e[2],30,30);
    //show selection
    if (e[0] == currentlevel) {ctx.fillStyle = 'red'; ctx.fillRect(e[1],e[2],10,10)};
  });
}

//LISTENERS
canvas.addEventListener('click', e => {
  if (currentscreen == 'map') {
    maplevels.forEach(f => {
      if ((e.offsetX > f[1] && e.offsetX < f[1]+30) && (e.offsetY > f[2] && e.offsetY < f[2]+30)) {drawLevel(f[0]); currentScreen = 'level'}
    })
  }

  if (currentscreen == 'level') {
    uibuttons.forEach(f => {
      if ((e.offsetX > f[1] && e.offsetX < f[1]+30) && (e.offsetY > f[2] && e.offsetY < f[2]+30)) {
        if (f[0] == 'back') {currentscreen = 'map'; drawMap()};
        if (f[0] == 'next') {}
      }
    })
  }
})


//RUNTIME
init();
drawMap();






</script></html>
