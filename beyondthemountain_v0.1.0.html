<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body {
  margin: 0;
}

canvas {

}</style></head><body><canvas></canvas>
<div id='debug'></div></body><script>//VARIABLES
//debug
let debug = document.getElementById('debug');

//canvas
let canvas = document.querySelector('canvas');
let ctx = canvas.getContext('2d');
let screenX = window.innerWidth;
let screenY = window.innerHeight;

//game
let levels = [['town',screenX/2,screenY - screenY/5],['lake',screenX/4,screenY/2,30,30],['forest',screenX - screenX/4,screenY/2],['mountain',screenX/2,screenY/5]];
let currentlevel = 'town';

//FUNCTIONS

function init() {
  canvas.width = screenX;
  canvas.height = screenY;
}

function checkLevel(level) {
  if ((currentlevel == 'town' && level != 'mountain')||(currentlevel == 'lake' && level != 'forest')||(currentlevel == 'forest' && level != 'lake')||(currentlevel == 'mountain' && level != 'town')) {
    currentlevel = level;
    loadLevel(level);
  }
  else debug.innerHTML = 'cannot load level';
}

function loadLevel(level) {
  debug.innerHTML = currentlevel;
}

function drawMap() {
  levels.forEach(e => {
    ctx.fillRect(e[1],e[2],30,30);
  });

  canvas.addEventListener('click', e => {
    levels.forEach(f => {
      if ((e.offsetX > f[1] && e.offsetX < f[1]+30) && (e.offsetY > f[2] && e.offsetY < f[2]+30)) checkLevel(f[0]);
    })
  })
}

//RUNTIME
init();
drawMap();






</script></html>
